services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  spring:
    build:
      context: ./server-spring
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/fortune_sheet_collab
    depends_on:
      - mongo
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 8082
      MONGODB_URI: mongodb://mongo:27017/fortune_sheet_collab
      REDIS_URL: redis://redis:6379/8
    depends_on:
      - mongo
      - redis
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - spring
      - gateway
volumes:
  mongo-data:
